const GEMINI_MODEL = "gemini-3.8-flash"; // 유효한 모델명으로 수정됨

function toGeminiParts(content){
  return content.map(b=>{
    if(b.type==="text") return {text: b.text};
    if(b.type==="image") return {inline_data:{mime_type: b.source.media_type, data: b.source.data}};
    return {text: JSON.stringify(b)};
  });
}

async function callClaude({system, content, maxTokens=8192}){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(state.apiKey)}`;
  const options = {
    method:"POST",
    headers:{ "content-type":"application/json" },
    body: JSON.stringify({
      system_instruction: { parts:[{text: system}] },
      contents: [{ role:"user", parts: toGeminiParts(content) }],
      generationConfig: { maxOutputTokens: 8192 }
    })
  };

  let res;
  const maxRetries = 5;
  
  for(let i=0; i<=maxRetries; i++){
    res = await fetch(url, options);
    if(res.ok || (res.status !== 503 && res.status !== 500 && res.status !== 429)) break; 
    if(i === maxRetries) break;

    let waitTime = Math.pow(2, i) * 4000 + Math.random() * 2000;
    if (res.status === 429) {
      waitTime = Math.max(waitTime, 15000 * (i + 1) + (Math.random() * 3000));
    }
    
    console.warn(`API 제한 또는 과부하(${res.status}). ${(waitTime/1000).toFixed(1)}초 후 재시도합니다... (${i+1}/${maxRetries}회차)`);
    await new Promise(r => setTimeout(r, waitTime));
  }

  if(!res.ok){
    const t = await res.text();
    let detail = t.slice(0,300);
    try{ detail = JSON.parse(t)?.error?.message || detail; }catch(e){}
    throw new Error("API 오류 ("+res.status+"): "+detail);
  }
  const data = await res.json();
  if(data.promptFeedback?.blockReason){
    throw new Error("구글 세이프티 필터에 막혔습니다 (사유: "+data.promptFeedback.blockReason+"). 이미지·텍스트 분량을 줄이거나 개인정보 일부를 가려서 다시 시도해줘.");
  }
  const cand = (data.candidates||[])[0];
  if(!cand) throw new Error("응답이 비어 있습니다 (원인 불명). 잠시 후 다시 시도해줘.");
  if(cand.finishReason && cand.finishReason!=="STOP"){
    throw new Error("응답이 끝까지 생성되지 못했습니다 (사유: "+cand.finishReason+"). 자료 양을 줄이거나 다시 시도해줘.");
  }
  return (cand.content?.parts||[]).filter(p=>p.text).map(p=>p.text).join("\n");
}

function extractJSON(text){
  let cleaned = text.replace(/```json/gi,"").replace(/```/g,"").trim();
  const m = cleaned.match(/\{[\s\S]*\}/);
  if(!m) throw new Error("JSON 형식을 찾지 못했습니다. (모델 응답: "+cleaned.slice(0,200)+")");
  try{
    let safeJson = m[0].replace(/[\n\r\t]/g, " ");
    return JSON.parse(safeJson);
  }catch(e){
    throw new Error("JSON 파싱 실패: "+e.message+" (응답 앞부분: "+m[0].slice(0,200)+")");
  }
}

async function renderPdfPagesAsImages(pdf, maxPages=21){
  const images = [];
  const n = Math.min(pdf.numPages, maxPages);
  for(let i=1;i<=n;i++){
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale:1.3});
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width; canvas.height = viewport.height;
    const ctx = canvas.getContext("2d");
    await page.render({canvasContext:ctx, viewport}).promise;
    const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
    images.push({data: dataUrl.split(",")[1], media:"image/jpeg"});
  }
  return images;
}

async function extractPdfContent(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let text = "";
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(" ") + "\n\n";
  }
  text = text.trim();
  let images = [];
  if(text.length < 50){
    images = await renderPdfPagesAsImages(pdf);
  }
  return {text, images};
}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result.split(",")[1]);
    r.onerror = ()=>rej(new Error("파일 읽기 실패"));
    r.readAsDataURL(file);
  });
}

async function onRecordPdf(ev){
  const f = ev.target.files[0]; if(!f) return;
  const statusEl = document.getElementById("recordPdfStatus");
  statusEl.textContent = "PDF 분석 중...";
  try{
    let {text, images} = await extractPdfContent(f);
    
    // 스캔본 PDF라 텍스트 추출이 안 된 경우, 페이지별 순차 OCR 진행
    if(text.length < 50 && images.length > 0){
      let fullText = "";
      
      for(let i = 0; i < images.length; i++){
        statusEl.textContent = `스캔본 PDF 감지! AI가 글자를 읽어오는 중입니다... (${i + 1}/${images.length} 페이지)`;
        
        const content = [
          { type: "text", text: `이 생기부 이미지(${i + 1}페이지) 속 모든 글자를 오타 없이 텍스트로 그대로 읽어서 전부 출력해줘.` },
          {
            type: "image",
            source: { type: "base64", media_type: images[i].media || "image/jpeg", data: images[i].data }
          }
        ];

        // 페이지 단위로 AI OCR 호출 (MAX_TOKENS 에러 방지)
        const pageText = await callClaude({
          system: "당신은 이미지 속 생기부 글자를 정확히 읽어내는 OCR 도구입니다. 다른 설명 없이 오직 추출된 텍스트만 반환하세요.",
          content,
          maxTokens: 4096
        });

        fullText += pageText.trim() + "\n\n";
      }
      
      text = fullText;
    }

    // 학년별 텍스트 자동 분류 및 입력창 채우기
    const parsedData = smartTextSplitter(text);
    
    state.record.g1 = parsedData.grade1 || text;
    state.record.g2 = parsedData.grade2;
    state.record.g3 = parsedData.grade3;
    state.record.autoImages = images;
    
    statusEl.textContent = "텍스트 추출 완료 (" + text.length + "자) — 아래 입력 칸에 자동으로 채워졌습니다!";
    render();
  }catch(e){
    statusEl.textContent = "추출 실패: " + e.message;
  }
}
  
function smartTextSplitter(text) {
    let result = { grade1: "", grade2: "", grade3: "" };
    
    const regex1 = /(?:\[?1학년\]?|1학년\s*성적|1학년\s*교과)/g;
    const regex2 = /(?:\[?2학년\]?|2학년\s*성적|2학년\s*교과)/g;
    const regex3 = /(?:\[?3학년\]?|3학년\s*성적|3학년\s*교과)/g;

    const matches1 = [...text.matchAll(regex1)].map(m => m.index);
    const matches2 = [...text.matchAll(regex2)].map(m => m.index);
    const matches3 = [...text.matchAll(regex3)].map(m => m.index);

    const idx1 = matches1.length > 0 ? matches1[0] : -1;
    const idx2 = matches2.length > 0 ? matches2[0] : -1;
    const idx3 = matches3.length > 0 ? matches3[0] : -1;

    if (idx1 !== -1) {
        let endIdx = idx2 !== -1 ? idx2 : (idx3 !== -1 ? idx3 : text.length);
        result.grade1 = text.substring(idx1, endIdx).trim();
    }
    if (idx2 !== -1) {
        let endIdx = idx3 !== -1 ? idx3 : text.length;
        result.grade2 = text.substring(idx2, endIdx).trim();
    }
    if (idx3 !== -1) {
        result.grade3 = text.substring(idx3).trim();
    }

    if (!result.grade1 && !result.grade2 && !result.grade3) {
        let parts = text.split(/(?=1학년|2학년|3학년)/);
        parts.forEach(part => {
            if (part.includes("1학년")) result.grade1 += part + "\n";
            else if (part.includes("2학년")) result.grade2 += part + "\n";
            else if (part.includes("3학년")) result.grade3 += part + "\n";
        });
    }

    return result;
} // <--- 누락된 중괄호 복구

async function onG3Images(ev){
  const files = Array.from(ev.target.files);
  if(!files.length) return;

  state.busy = true; render(); // 텍스트 추출 중 로딩 표시
  try {
    if(!state.record.g3Images) state.record.g3Images = [];
    
    // 1. 올린 사진 파일 변환 및 저장
    for(const f of files){
      const data = await fileToBase64(f);
      state.record.g3Images.push({name:f.name, data, media:f.type||"image/jpeg"});
    }
    
    // 2. AI에게 사진 속 텍스트 추출 요청 (OCR)
    const content = [
      { type: "text", text: "첨부된 생활기록부 사진들의 글자를 오타 없이 텍스트로 그대로 모두 추출해서 출력해줘." }
    ];
    
    state.record.g3Images.forEach(img => {
      content.push({
        type: "image",
        source: {
          type: "base64",
          media_type: img.media || "image/jpeg",
          data: img.data
        }
      });
    });

    const extractedText = await callClaude({
      system: "당신은 이미지 속 생기부 글자를 정확히 읽어내는 OCR 도구입니다. 다른 설명 없이 오직 추출된 텍스트만 반환하세요.",
      content,
      maxTokens: 8192
    });

    // 3. 추출된 텍스트를 3학년 입력창(state.record.g3)에 자동 저장
    state.record.g3 = (state.record.g3 ? state.record.g3 + "\n\n" : "") + extractedText.trim();

  } catch(e) {
    state.error = "텍스트 추출 실패: " + e.message;
  }
  state.busy = false;
  render();
}

const ANALYSIS_PRINCIPLES = `너는 대입 학생부종합전형 면접 준비를 돕는 분석가다. 반드시 지켜야 할 원칙:
1) 오직 사용자가 제공한 생기부 텍스트/이미지와 학교 모집요강 텍스트/이미지 안에 있는 내용만 근거로 삼는다. 외부 지식으로 대학·학과 정보를 추측하거나 지어내지 않는다.
2) 생기부에 없는 활동이나 성취를 만들어내지 않는다. 근거가 불충분하면 "생기부 내 근거 부족"이라고 명시한다.
3) 최종 답변을 만들기 전에 스스로 각 주장이 어느 생기부 구절에 근거하는지 내부적으로 검증하고, 근거 없는 문문을 삭제한다(할루시네이션 자체 검증).
4) 반드시 순수 JSON 객체 하나만 출력한다. 코드블록 기호나 설명 문장, 마크다운 코드펜스를 붙이지 않는다.`;

function buildAnalysisUserContent(instructionText, includeImages=true){
  const schoolsText = state.schools.map((s,i)=>
    `[학교 ${i+1}] 이름:${s.name||"(미입력)"} / 학과:${s.dept||"(미입력)"} / 전형:${s.admissionType||"(미입력)"}\n인재상(직접입력):${s.idealTraits||"(없음)"}\n모집요강 텍스트:\n${(s.guideText||"(없음)").slice(0,15000)}`
  ).join("\n\n---\n\n");

  const gradesText = state.record.gradesTable.length
    ? state.record.gradesTable.map(r=>`${r.grade} ${r.semester} ${r.subject}: 등급 ${r.gradeLevel||"-"}, 원점수/평균 ${r.rawScore||"-"}, 표준편차 ${r.stdDev||"-"}, 성취도 ${r.achievement||"-"}`).join("\n")
    : (state.record.grades||"(입력 없음)");
  const recordText = `[1학년]\n${state.record.g1||"(내용 없음)"}\n\n[2학년]\n${state.record.g2||"(내용 없음)"}\n\n[3학년(PDF)]\n${state.record.g3||"(내용 없음)"}\n\n[성적표(사용자 확인/수정본)]\n${gradesText}\n\n[학생이 생각하는 본인 강점]\n${state.record.selfStrength||"(입력 없음)"}`;

  const hasAuto = state.record.autoImages.length>0;
  const hasSchoolImgs = state.schools.some(s=>s.guideImages&&s.guideImages.length);
  const content = [
    {type:"text", text: (instructionText||"")+"\n\n=== 학교별 자료 ===\n"+schoolsText+"\n\n=== 생기부 자료 ===\n"+recordText +
      (state.record.g3Images.length? "\n\n3학년 보완 자료 사진이 이어서 첨부됩니다. 사진 속 텍스트도 3학년 생기부 내용으로 취급해서 분석해줘.":"") +
      (hasAuto? "\n\n생기부 PDF가 글자 인식이 안 되는 스캔본이라 페이지 이미지로 변환해 이어서 첨부합니다. 이 이미지들을 생기부 원문으로 취급해서 읽어줘.":"") +
      (hasSchoolImgs? "\n\n일부 학교의 모집요강/인재상 자료도 이미지로 첨부됩니다. 어느 학교 자료인지는 이미지 순서와 위 학교 목록 순서를 대조해서 판단해줘.":"") +
      (!includeImages? "":"") }
  ];
  if(includeImages){
    state.record.g3Images.forEach(img=>{
      content.push({type:"image", source:{type:"base64", media_type: img.media.startsWith("image/")?img.media:"image/jpeg", data: img.data}});
    });
    state.record.autoImages.forEach(img=>{
      content.push({type:"image", source:{type:"base64", media_type: img.media, data: img.data}});
    });
    state.schools.forEach(s=>{
      (s.guideImages||[]).forEach(img=>{
        content.push({type:"image", source:{type:"base64", media_type: img.media, data: img.data}});
      });
      (s.idealTraitImages||[]).forEach(img=>{
        content.push({type:"image", source:{type:"base64", media_type: img.media, data: img.data}});
      });
    });
  }
  return content;
}

async function generateMindmap() {
  const svgEl = document.getElementById("mindmapSvg");
  if (!svgEl) return;
  svgEl.innerHTML = "<text x='50%' y='50%' text-anchor='middle' fill='var(--sub)'>AI가 마인드맵 구조를 그리는 중입니다...</text>";

  try {
    const prompt = `아래 생기부 분석 데이터를 바탕으로 핵심 키워드, 학년별 주요 활동, 강점을 마인드맵용 마크다운(Markdown list)으로 작성해줘.
개요 형식(# 중심주제, ## 1차 카테고리, - 상세 활동)만 포함하고 다른 설명은 절대 출력하지 마.

[분석 데이터]
${JSON.stringify(state.analysis)}`;

    const markdownText = await callClaude({
      system: "너는 마인드맵 시각화를 위한 마크다운 변환기다. 코드블록 없이 오직 마크다운 목록(#, ##, -)만 반환하라.",
      content: [{ type: "text", text: prompt }],
      maxTokens: 2000
    });

    const cleanMd = markdownText.replace(/```markdown/gi, "").replace(/```/g, "").trim();
    
    // Markmap 렌더링 실행
    const transformer = new window.markmap.Transformer();
    const { root } = transformer.transform(cleanMd);
    
    svgEl.innerHTML = "";
    window.markmap.Markmap.create(svgEl, { autoFit: true }, root);
  } catch (e) {
    alert("마인드맵 생성 실패: " + e.message);
  }
}
function retryAnalysis(){
  state.error = "";
  state.analysis = null;
  render();
}

async function runStage(label, instructionText, maxTokens, includeImages=true){
  state.analysisProgress.label = label;
  render();
  const content = buildAnalysisUserContent(instructionText, includeImages);
  const raw = await callClaude({system: ANALYSIS_PRINCIPLES, content, maxTokens});
  const parsed = extractJSON(raw);
  state.analysisProgress.step++;
  return parsed;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function runAnalysis(){
  state.busy = true; state.error = "";
  state.analysis = {schools:null, activityGrades:null, strengthsWeaknesses:null, weaknessImprovementEfforts:null, selfPerceptionCompare:null};
  state.analysisProgress = {step:0, total:5, label:"학교별 우선순위 활동 분석 중"};
  render();
  try{
    let r = await runStage("학교별 우선순위 활동 분석 중",
      `아래 자료를 보고, 지원 학교별로 인재상/모집요강에 가장 부합하는 생기부 활동을 최대 5개씩 뽑아라. 각 활동에는 이유(생기부 근거 포함)를 붙여라.
      출력 JSON(다른 텍스트 없이 이것만): {"schools":[{"name":"학교명","priorityActivities":["활동명 - 이유(근거 포함)"],"ideaFitNote":"이 학교 인재상과 학생 활동의 연결점 요약"}]}`, 8192, true);
    state.analysis.schools = r.schools; render();

    await sleep(4000);

    r = await runStage("전체 활동 S~C 등급 분류 중",
      `생기부에 나온 활동 전체(위 우선순위에 포함 안 된 것 포함)를 등급화하라.
      S=진로역량+전공적합성+심화연계를 종합했을 때 최상급 / A+=S급은 아니지만 A급보다 한 수 위 / A=학생 수준에서 제대로 이해했고 학년 범위를 크게 벗어나지 않음 / B+=보완하면 좋을 활동 / B=평이한 수준 / C=근거가 약하거나 형식적.
      출력 JSON(이것만): {"activityGrades":[{"grade":"S 또는 A+ 또는 A 또는 B+ 또는 B 또는 C","activity":"활동명(학년/과목)","reason":"등급 판단 근거"}]}`, 8192, true);
    state.analysis.activityGrades = r.activityGrades; render();

    await sleep(4000);

    r = await runStage("성적 기반 강점/약점 분석 중",
      `제공된 성적(학년/학기별 등급·성취도·표준편차)을 바탕으로 상대적으로 강한 과목군과 약한 과목군을 정리하라. 근거가 되는 과목/등급/표준편차를 함께 밝혀라.
      출력 JSON(이것만): {"strengthsWeaknesses":{"strengths":["..."],"weaknesses":["..."]}}`, 1500, false);
    state.analysis.strengthsWeaknesses = r.strengthsWeaknesses; render();

    await sleep(4000);

    r = await runStage("약점 보완 노력 탐색 중",
      `방금 찾은 약점은 다음과 같다: ${JSON.stringify(state.analysis.strengthsWeaknesses.weaknesses)}.
      생기부 안에서 이 약점들을 스스로 보완하려 한 흔적(추가 탐구, 관련 독서, 방과후 활동, 세특 내 성찰 문구 등)을 찾아라. 근거가 없으면 억지로 만들지 말고 배열을 비워둬라.
      출력 JSON(이것만): {"weaknessImprovementEfforts":[{"weakness":"관련 약점","evidence":"생기부 내 보완 노력 근거","interviewTip":"면접에서 어떻게 활용할지 구체적 코멘트"}]}`, 1800, true);
    state.analysis.weaknessImprovementEfforts = r.weaknessImprovementEfforts; render();

    await sleep(4000);

    r = await runStage("자기 인식 비교 중",
      `학생이 스스로 생각하는 자신의 강점(자료의 "학생이 생각하는 본인 강점" 항목)과, 지금까지 분석에서 확인된 실제 강점(${JSON.stringify(state.analysis.strengthsWeaknesses.strengths)} 및 상위 등급 활동들)을 비교하라.
      차이가 없으면 억지로 차이를 만들지 말고 gap에 "차이 없음"이라고만 써라.
      출력 JSON(이것만): {"selfPerceptionCompare":{"studentBelieves":"학생이 밝힌 강점 요약","actualFound":"실제 확인되는 강점 요약","gap":"차이 여부와 내용, 없으면 '차이 없음'","suggestion":"차이가 있을 때만 준비 대안. 없으면 빈 문자열"}}`, 1200, false);
    state.analysis.selfPerceptionCompare = r.selfPerceptionCompare; render();

  }catch(e){
    state.error = e.message;
  }
  state.busy = false; render();
}

function buildInterviewSystemPrompt(){
  return `너는 대입 면접관이다. 반드시 아래 지시를 따르고 순수 JSON 객체만 출력하라.

[지시사항]
제공된 생기부 원문에서 형광펜을 칠할 '정확한 키워드 단어/구절'을 원문에서 그대로 찾아 추출하고, 이를 기반으로 압박 질문 3개를 생성하라.

1. yellowKeywords: 전공 관련 핵심 개념어/전문 용어 (예: ["바루브르크효과"])
2. greenKeywords: 수치, 통계, 측정 데이터 (예: ["34.8%"])
3. redKeywords: 학생의 주요 주장, 결론 (예: ["가변적 조정이 최적의 대안"])

[출력 JSON 스키마 (다른 설명 절대 금지)]
{
  "yellowKeywords": ["원문에 있는 정확한 단어"],
  "greenKeywords": ["원문에 있는 정확한 단어"],
  "redKeywords": ["원문에 있는 정확한 단어"],
  "questions": [
    {"question": "압박 질문 내용", "basedOn": "타겟 키워드", "sampleAnswer": "모범 답변"}
  ]
}`;
}

async function generateQuestions(){
  state.busy = true; state.error=""; render();
  try{
    const rawRecordText = `[1학년]\n${state.record.g1 || ""}\n\n[2학년]\n${state.record.g2 || ""}\n\n[3학년]\n${state.record.g3 || ""}`;
    
    if (!state.record.g1 && !state.record.g2 && !state.record.g3) {
      throw new Error("생기부 텍스트가 없습니다. '3. 생기부' 단계에서 텍스트를 채워주세요.");
    }

    const prompt = `[생기부 원문]\n${rawRecordText}\n\n위 생기부에서 형광펜을 칠할 단어/구절들과 압박 질문 3개를 추출해줘.`;

    // AI는 단어 목록과 질문만 짧게 추출 (MAX_TOKENS 에러 완전 방지)
    const raw = await callClaude({
      system: buildInterviewSystemPrompt(),
      content: [{ type: "text", text: prompt }],
      maxTokens: 2048
    });
    
    const parsed = extractJSON(raw);

    // 원문 텍스트는 1글자도 변경하지 않고, AI가 찾아낸 키워드에만 자바스크립트로 형광펜 태그 삽입
    const applyHighlight = (originalText) => {
      if (!originalText) return "";
      let result = originalText;

      (parsed.yellowKeywords || []).forEach(kw => {
        if (kw && kw.trim()) result = result.split(kw).join(`<mark class="hl-yellow">${kw}</mark>`);
      });
      (parsed.greenKeywords || []).forEach(kw => {
        if (kw && kw.trim()) result = result.split(kw).join(`<mark class="hl-green">${kw}</mark>`);
      });
      (parsed.redKeywords || []).forEach(kw => {
        if (kw && kw.trim()) result = result.split(kw).join(`<mark class="hl-red">${kw}</mark>`);
      });

      return result;
    };

    state.interview.highlightedG1 = applyHighlight(state.record.g1);
    state.interview.highlightedG2 = applyHighlight(state.record.g2);
    state.interview.highlightedG3 = applyHighlight(state.record.g3);
    state.interview.highlightedText = `[1학년]\n${state.interview.highlightedG1}\n\n[2학년]\n${state.interview.highlightedG2}\n\n[3학년]\n${state.interview.highlightedG3}`;
    state.interview.questions = parsed.questions || [];
    state.interview.idx = 0;
  }catch(e){ state.error = e.message; }
  state.busy = false; render();
}

async function submitAnswer(qIdx, answerText, isFollowup, followupParentIdx){
  if(!answerText.trim()) return;
  state.busy = true; render();
  try{
    if(!isFollowup){
      state.interview.log[qIdx] = {q: state.interview.questions[qIdx].question, a: answerText, followups: []};
    } else {
      const entry = state.interview.log[followupParentIdx];
      entry.followups[entry.followups.length-1].a = answerText;
    }
    const entry = state.interview.log[isFollowup?followupParentIdx:qIdx];
    const content = [{type:"text", text:
      `원 질문: ${entry.q}\n학생 답변 기록(순서대로): ${JSON.stringify([{a:entry.a}, ...entry.followups])}\n
      생기부 분석 요약: ${JSON.stringify(state.analysis)}\n
      이 답변과 직접 관련 있고 주제에서 벗어나지 않는 추가질문이 필요한지 판단해줘. 필요 없으면 needFollowup:false.
      JSON: {"needFollowup":true/false, "followupQuestion":"..."}`
    }];
    const raw = await callClaude({system: buildInterviewSystemPrompt(), content, maxTokens:800});
    const parsed = extractJSON(raw);
    if(parsed.needFollowup && parsed.followupQuestion){
      entry.followups.push({q: parsed.followupQuestion, a:""});
    }
  }catch(e){ state.error = e.message; }
  state.busy = false; render();
}

function renderStep4(){
  const app = document.getElementById("app");
  if(state.interview.questions.length===0 && !state.busy && !state.error){
    generateQuestions();
    return;
  }
  if(state.busy && state.interview.questions.length===0){
    app.innerHTML = card("질문 생성 중", `<div class="loading"><div class="spin"></div> 생기부 원문을 분석하여 형광펜을 칠하고 압박 질문을 생성하는 중이야.</div>
      <div class="row"><button class="ghost" onclick="goStep(state.step-1)">이전 단계로</button></div>`);
    return;
  }
  if(state.error && state.interview.questions.length===0){
    app.innerHTML = card("질문 생성 실패", `<div class="err">${state.error}</div>
      <div class="row"><button class="ghost" onclick="goStep(state.step-1)">이전</button><button onclick="state.error='';generateQuestions();">다시 시도</button></div>`);
    return;
  }
  
  // 등급 스타일 설정
const grade = state.interview?.grade || "A";
const gradeReason = state.interview?.gradeReason || "세부 사유 분석 완료";

const gradeColors = {
  "S": { bg: "#fef3c7", text: "#d97706", border: "#f59e0b" },
  "A+": { bg: "#dbeafe", text: "#2563eb", border: "#3b82f6" },
  "A": { bg: "#d1fae5", text: "#059669", border: "#10b981" }
};
const style = gradeColors[grade] || gradeColors["A"];

// 1. 종합 평가 등급 카드 (상단 배치)
let html = card("생기부 종합 평가 등급", `
  <div style="display: flex; align-items: center; gap: 20px; padding: 10px 0;">
    <div style="
      font-size: 36px; 
      font-weight: 900; 
      background: ${style.bg}; 
      color: ${style.text}; 
      border: 2px solid ${style.border}; 
      padding: 12px 24px; 
      border-radius: 16px;
      min-width: 90px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    ">
      ${grade}
    </div>
    <div style="flex: 1; font-size: 15px; line-height: 1.6; color: #374151;">
      <strong style="color: #111827; font-size: 16px;">[평가 총평 및 산출 사유]</strong><br>
      ${gradeReason}
    </div>
  </div>
`);

// 2. 기존 형광펜 분석 카드
html += card("AI 생기부 핵심 분석 (형광펜)", `
  <div class="muted" style="margin-bottom:8px;">노랑: 개념어 / 초록: 수치·자료 / 빨강: 주장·결론</div>
  <div class="highlight-board">${state.interview?.highlightedText || state.interview?.highlightText || state.interview?.highlights || "형광펜 분석 데이터가 없습니다."}</div>
`);

  html += card("맞춤형 압박 모의 면접", `<p class="muted">위에서 칠해진 핵심 키워드를 바탕으로 생성된 압박 질문이야.</p>${state.error?`<div class="err">${state.error}</div>`:""}`);
  state.interview.questions.forEach((q,i)=>{
    const log = state.interview.log[i];
    html += `<div class="card">
      <div class="chat-msg chat-q" style="position: relative;">
        <b>Q${i+1}.</b> ${q.question}
        <div class="muted">타겟 키워드: ${q.basedOn||""}</div>
        <button onclick="speakQuestion('${q.question.replace(/'/g, "\\'")}')" style="margin-top: 8px; padding: 4px 10px; font-size: 13px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer;">🔊 질문 듣기</button>
      </div>
      <details><summary>예시 답변 보기</summary><div class="muted">${q.sampleAnswer||""}</div></details>
      ${log? `<div class="chat-msg chat-a">${log.a}</div>` : 
        `<div style="margin: 6px 0;">
           <button id="stt-btn-${i}" onclick="startSTT(${i})" type="button" style="padding: 6px 12px; font-size: 13px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer;">🎙️ 음성으로 답변하기</button>
         </div>
         <textarea id="ans${i}" placeholder="답변을 입력하거나 음성으로 말해주세요"></textarea>
         <div class="row"><button ${state.busy?"disabled":""} onclick="submitAnswer(${i}, document.getElementById('ans${i}').value, false)">답변 제출</button></div>`}
      ${log && log.followups.map((f,fi)=>`
        <div class="chat-msg chat-f"><b>추가질문.</b> ${f.q}</div>${f.a? `<div class="chat-msg chat-a">${f.a}</div>` :
          `<textarea id="fans${i}_${fi}" placeholder="추가질문 답변"></textarea>
           <div class="row"><button ${state.busy?"disabled":""} onclick="submitAnswer(${i}, document.getElementById('fans${i}_${fi}').value, true, ${i})">답변 제출</button></div>`}
      `).join("") || ""}
    </div>`;
  });
  html += navButtons({nextLabel:"완료", next:false});
  app.innerHTML = html;
}

function onNext(){
  state.error="";
  if(state.step===0){
    const key = document.getElementById("apiKeyInput").value.trim();
    if(!key){ document.getElementById("step0err").textContent = "API 키를 입력해줘."; return; }
    state.apiKey = key; saveKey();
  }
  if(state.step===1){
    if(state.schools.every(s=>!s.name)){ document.getElementById("step1err").textContent = "학교를 최소 1개 입력해줘."; return; }
  }
  if(state.step===2){
    if(!state.record.g1 && !state.record.g2 && !state.record.g3 && state.record.g3Images.length===0 && state.record.autoImages.length===0){
      document.getElementById("step2err").textContent = "생기부 내용을 최소한 하나는 입력해줘.";
      return;
    }
  }
  if(state.step===3){
    state.analysis = null; state.error="";
  }
  if(state.step===4){
    state.interview.questions = [];
  }
  state.step++;
  render();
}

render();

// 3색 형광펜 기능 이벤트 리스너
document.addEventListener('mouseup', function(e) {
  const hlPopup = document.getElementById('hlPopup');
  if(hlPopup.contains(e.target)) return;
  
  const sel = window.getSelection();
  if(sel.toString().trim().length > 0 && !e.target.closest('input, textarea')) {
    const range = sel.getRangeAt(0);
    const rect = range.getBoundingClientRect();
    
    hlPopup.style.display = 'flex';
    hlPopup.style.top = (rect.top + window.scrollY - 45) + 'px';
    hlPopup.style.left = (rect.left + window.scrollX + (rect.width / 2) - 50) + 'px';
  } else {
    hlPopup.style.display = 'none';
  }
});

function doHighlight(color) {
  document.designMode = "on";
  document.execCommand("hiliteColor", false, color); 
  document.execCommand("backColor", false, color);   
  document.designMode = "off";
  
  document.getElementById('hlPopup').style.display = 'none';
  window.getSelection().removeAllRanges();
}
</script>
  <script>
// 개선된 TTS: 진짜 남성 보이스 우선 감지 및 뭉개짐 방지
function speakQuestion(text) {
  if (!('speechSynthesis' in window)) {
    alert("이 브라우저는 음성 출력(TTS)을 지원하지 않습니다.");
    return;
  }
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'ko-KR';

  const voices = window.speechSynthesis.getVoices();
  
  // 1. 한국어 남성 / 신경망(Natural/Neural) 고품질 보이스 우선 탐색
  const maleVoice = voices.find(v => 
    v.lang.includes('ko') && (
      v.name.includes('InJoon') || 
      v.name.includes('BongJin') || 
      v.name.includes('Neural') || 
      v.name.includes('Natural') || 
      v.name.includes('Male') ||
      v.name.includes('남성')
    )
  );

  if (maleVoice) {
    utterance.voice = maleVoice;
    utterance.pitch = 0.95; // 남성 보이스일 때는 자연스러운 톤 유지
    utterance.rate = 0.9;
  } else {
    // 남성 보이스가 없는 환경(크롬 기본 등)에서는 피치를 억지로 낮추지 않고 또박또박 읽기
    utterance.pitch = 1.0;
    utterance.rate = 0.95;
  }

  window.speechSynthesis.speak(utterance);
}
</script>
