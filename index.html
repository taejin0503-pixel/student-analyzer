const GEMINI_MODEL = "gemini-3.8-flash"; // 유효한 모델명으로 수정됨

function toGeminiParts(content){
  return content.map(b=>{
    if(b.type==="text") return {text: b.text};
    if(b.type==="image") return {inline_data:{mime_type: b.source.media_type, data: b.source.data}};
    return {text: JSON.stringify(b)};
  });
}

async function callClaude({system, content, maxTokens=8192}){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(state.apiKey)}`;
  const options = {
    method:"POST",
    headers:{ "content-type":"application/json" },
    body: JSON.stringify({
      system_instruction: { parts:[{text: system}] },
      contents: [{ role:"user", parts: toGeminiParts(content) }],
      generationConfig: { maxOutputTokens: 8192 }
    })
  };

  let res;
  const maxRetries = 5;
  
  for(let i=0; i<=maxRetries; i++){
    res = await fetch(url, options);
    if(res.ok || (res.status !== 503 && res.status !== 500 && res.status !== 429)) break; 
    if(i === maxRetries) break;

    let waitTime = Math.pow(2, i) * 4000 + Math.random() * 2000;
    if (res.status === 429) {
      waitTime = Math.max(waitTime, 15000 * (i + 1) + (Math.random() * 3000));
    }
    
    console.warn(`API 제한 또는 과부하(${res.status}). ${(waitTime/1000).toFixed(1)}초 후 재시도합니다... (${i+1}/${maxRetries}회차)`);
    await new Promise(r => setTimeout(r, waitTime));
  }

  if(!res.ok){
    const t = await res.text();
    let detail = t.slice(0,300);
    try{ detail = JSON.parse(t)?.error?.message || detail; }catch(e){}
    throw new Error("API 오류 ("+res.status+"): "+detail);
  }
  const data = await res.json();
  if(data.promptFeedback?.blockReason){
    throw new Error("구글 세이프티 필터에 막혔습니다 (사유: "+data.promptFeedback.blockReason+"). 이미지·텍스트 분량을 줄이거나 개인정보 일부를 가려서 다시 시도해줘.");
  }
  const cand = (data.candidates||[])[0];
  if(!cand) throw new Error("응답이 비어 있습니다 (원인 불명). 잠시 후 다시 시도해줘.");
  if(cand.finishReason && cand.finishReason!=="STOP"){
    throw new Error("응답이 끝까지 생성되지 못했습니다 (사유: "+cand.finishReason+"). 자료 양을 줄이거나 다시 시도해줘.");
  }
  return (cand.content?.parts||[]).filter(p=>p.text).map(p=>p.text).join("\n");
}

function extractJSON(text){
  let cleaned = text.replace(/```json/gi,"").replace(/```/g,"").trim();
  const m = cleaned.match(/\{[\s\S]*\}/);
  if(!m) throw new Error("JSON 형식을 찾지 못했습니다. (모델 응답: "+cleaned.slice(0,200)+")");
  try{
    let safeJson = m[0].replace(/[\n\r\t]/g, " ");
    return JSON.parse(safeJson);
  }catch(e){
    throw new Error("JSON 파싱 실패: "+e.message+" (응답 앞부분: "+m[0].slice(0,200)+")");
  }
}

async function renderPdfPagesAsImages(pdf, maxPages=21){
  const images = [];
  const n = Math.min(pdf.numPages, maxPages);
  for(let i=1;i<=n;i++){
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale:1.3});
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width; canvas.height = viewport.height;
    const ctx = canvas.getContext("2d");
    await page.render({canvasContext:ctx, viewport}).promise;
    const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
    images.push({data: dataUrl.split(",")[1], media:"image/jpeg"});
  }
  return images;
}

async function extractPdfContent(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let text = "";
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(" ") + "\n\n";
  }
  text = text.trim();
  let images = [];
  if(text.length < 50){
    images = await renderPdfPagesAsImages(pdf);
  }
  return {text, images};
}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result.split(",")[1]);
    r.onerror = ()=>rej(new Error("파일 읽기 실패"));
    r.readAsDataURL(file);
  });
}

function renderTraitThumbs(idx){
  const el = document.getElementById("school"+idx+"traitThumbs");
  if(!el) return;
  const imgs = state.schools[idx].idealTraitImages||[];
  el.innerHTML = imgs.map((img,i)=>`
    <div class="thumb-wrap"><img src="data:${img.media};base64,${img.data}"><button onclick="removeTraitImage(${idx},${i})">×</button></div>
  `).join("");
}

async function onIdealTraitImages(ev, idx){
  const files = Array.from(ev.target.files);
  if(!state.schools[idx].idealTraitImages) state.schools[idx].idealTraitImages = [];
  for(const f of files){
    const data = await fileToBase64(f);
    state.schools[idx].idealTraitImages.push({data, media:f.type||"image/jpeg"});
  }
  renderTraitThumbs(idx);
}

function removeTraitImage(idx,i){ state.schools[idx].idealTraitImages.splice(i,1); renderTraitThumbs(idx); }
function addSchool(){ state.schools.push({name:"",dept:"",admissionType:"",guideText:"",idealTraits:"",guideImages:[],idealTraitImages:[]}); render(); }
function removeSchool(i){ state.schools.splice(i,1); if(state.schools.length===0) state.schools.push({name:"",dept:"",admissionType:"",guideText:"",idealTraits:"",guideImages:[],idealTraitImages:[]}); render(); }

async function onRecordPdf(ev){
  const f = ev.target.files[0]; if(!f) return;
  const statusEl = document.getElementById("recordPdfStatus");
  statusEl.textContent = "PDF 분석 중...";
  try{
    let {text, images} = await extractPdfContent(f);
    
    // 스캔본 PDF라 텍스트 추출이 안 된 경우, 페이지별 순차 OCR 진행
    if(text.length < 50 && images.length > 0){
      let fullText = "";
      
      for(let i = 0; i < images.length; i++){
        statusEl.textContent = `스캔본 PDF 감지! AI가 글자를 읽어오는 중입니다... (${i + 1}/${images.length} 페이지)`;
        
        const content = [
          { type: "text", text: `이 생기부 이미지(${i + 1}페이지) 속 모든 글자를 오타 없이 텍스트로 그대로 읽어서 전부 출력해줘.` },
          {
            type: "image",
            source: { type: "base64", media_type: images[i].media || "image/jpeg", data: images[i].data }
          }
        ];

        // 페이지 단위로 AI OCR 호출 (MAX_TOKENS 에러 방지)
        const pageText = await callClaude({
          system: "당신은 이미지 속 생기부 글자를 정확히 읽어내는 OCR 도구입니다. 다른 설명 없이 오직 추출된 텍스트만 반환하세요.",
          content,
          maxTokens: 4096
        });

        fullText += pageText.trim() + "\n\n";
      }
      
      text = fullText;
    }

    // 학년별 텍스트 자동 분류 및 입력창 채우기
    const parsedData = smartTextSplitter(text);
    
    state.record.g1 = parsedData.grade1 || text;
    state.record.g2 = parsedData.grade2;
    state.record.g3 = parsedData.grade3;
    state.record.autoImages = images;
    
    statusEl.textContent = "텍스트 추출 완료 (" + text.length + "자) — 아래 입력 칸에 자동으로 채워졌습니다!";
    render();
  }catch(e){
    statusEl.textContent = "추출 실패: " + e.message;
  }
}
  
function smartTextSplitter(text) {
    let result = { grade1: "", grade2: "", grade3: "" };
    
    const regex1 = /(?:\[?1학년\]?|1학년\s*성적|1학년\s*교과)/g;
    const regex2 = /(?:\[?2학년\]?|2학년\s*성적|2학년\s*교과)/g;
    const regex3 = /(?:\[?3학년\]?|3학년\s*성적|3학년\s*교과)/g;

    const matches1 = [...text.matchAll(regex1)].map(m => m.index);
    const matches2 = [...text.matchAll(regex2)].map(m => m.index);
    const matches3 = [...text.matchAll(regex3)].map(m => m.index);

    const idx1 = matches1.length > 0 ? matches1[0] : -1;
    const idx2 = matches2.length > 0 ? matches2[0] : -1;
    const idx3 = matches3.length > 0 ? matches3[0] : -1;

    if (idx1 !== -1) {
        let endIdx = idx2 !== -1 ? idx2 : (idx3 !== -1 ? idx3 : text.length);
        result.grade1 = text.substring(idx1, endIdx).trim();
    }
    if (idx2 !== -1) {
        let endIdx = idx3 !== -1 ? idx3 : text.length;
        result.grade2 = text.substring(idx2, endIdx).trim();
    }
    if (idx3 !== -1) {
        result.grade3 = text.substring(idx3).trim();
    }

    if (!result.grade1 && !result.grade2 && !result.grade3) {
        let parts = text.split(/(?=1학년|2학년|3학년)/);
        parts.forEach(part => {
            if (part.includes("1학년")) result.grade1 += part + "\n";
            else if (part.includes("2학년")) result.grade2 += part + "\n";
            else if (part.includes("3학년")) result.grade3 += part + "\n";
        });
    }

    return result;
} // <--- 누락된 중괄호 복구

async function onG3Images(ev){
  const files = Array.from(ev.target.files);
  if(!files.length) return;

  state.busy = true; render(); // 텍스트 추출 중 로딩 표시
  try {
    if(!state.record.g3Images) state.record.g3Images = [];
    
    // 1. 올린 사진 파일 변환 및 저장
    for(const f of files){
      const data = await fileToBase64(f);
      state.record.g3Images.push({name:f.name, data, media:f.type||"image/jpeg"});
    }
    
    // 2. AI에게 사진 속 텍스트 추출 요청 (OCR)
    const content = [
      { type: "text", text: "첨부된 생활기록부 사진들의 글자를 오타 없이 텍스트로 그대로 모두 추출해서 출력해줘." }
    ];
    
    state.record.g3Images.forEach(img => {
      content.push({
        type: "image",
        source: {
          type: "base64",
          media_type: img.media || "image/jpeg",
          data: img.data
        }
      });
    });

    const extractedText = await callClaude({
      system: "당신은 이미지 속 생기부 글자를 정확히 읽어내는 OCR 도구입니다. 다른 설명 없이 오직 추출된 텍스트만 반환하세요.",
      content,
      maxTokens: 8192
    });

    // 3. 추출된 텍스트를 3학년 입력창(state.record.g3)에 자동 저장
    state.record.g3 = (state.record.g3 ? state.record.g3 + "\n\n" : "") + extractedText.trim();

  } catch(e) {
    state.error = "텍스트 추출 실패: " + e.message;
  }
  state.busy = false;
  render();
}

  el.innerHTML = state.record.g3Images.map((img,i)=>`

  `).join("");
}

function removeG3Image(i){ state.record.g3Images.splice(i,1); renderG3Thumbs(); }

const GRADE_COLS = [
  {key:"grade", label:"학년"}, {key:"semester", label:"학기"}, {key:"subject", label:"과목"},
  {key:"rawScore", label:"원점수/평균"}, {key:"gradeLevel", label:"등급"},
  {key:"stdDev", label:"표준편차"}, {key:"achievement", label:"성취도"}
];

function emptyGradeRow(){ return {grade:"",semester:"",subject:"",rawScore:"",gradeLevel:"",stdDev:"",achievement:""}; }

async function extractGradesTable(){
  state.gradesBusy = true; state.gradesError = ""; state.gradesTried = true; render();
  try{
    const content = buildAnalysisUserContent(
      `아래 생기부/성적 자료에서 과목별 성적 정보를 표로 뽑아라. 학년·학기·과목마다 한 행씩 만들어라. 값을 모르면 빈 문자열로 둬라. 지어내지 마라.
      출력 JSON(이것만): {"rows":[{"grade":"1학년","semester":"1학기","subject":"수학","rawScore":"","gradeLevel":"","stdDev":"","achievement":""}]}`, true);
    const raw = await callClaude({system: ANALYSIS_PRINCIPLES, content, maxTokens:3000});
    const parsed = extractJSON(raw);
    state.record.gradesTable = (parsed.rows||[]).map(r=>({...emptyGradeRow(), ...r}));
  }catch(e){
    state.gradesError = e.message;
  }
  state.gradesBusy = false; render();
}

function renderStepGrades(){
  const app = document.getElementById("app");
  const hasSource = state.record.g1||state.record.g2||state.record.g3||state.record.grades||state.record.g3Images.length||state.record.autoImages.length;
  if(!state.gradesTried && !state.gradesBusy && hasSource){
    extractGradesTable();
    return;
  }
  let inner = `<p class="muted">생기부/성적 자료에서 뽑은 성적표야. 잘못된 값이 있으면 직접 고쳐줘. 이 표가 이후 분석에 그대로 쓰여.</p>`;
  if(state.gradesBusy){
    inner += `<div class="loading"><div class="spin"></div> 성적표를 추출하는 중이야.</div>
      <div class="row"><button class="ghost" onclick="goStep(state.step-1)">이전 단계로</button></div>`;
    app.innerHTML = card("성적표 확인", inner);
    return;
  }
  if(state.gradesError){
    inner += `<div class="err">${state.gradesError}</div>
      <div class="row"><button class="ghost" onclick="goStep(state.step-1)">이전</button><button onclick="state.gradesError='';extractGradesTable();">다시 추출</button><button class="ghost" onclick="state.gradesError='';state.gradesTried=true;render();">직접 입력할래</button></div>`;
    app.innerHTML = card("성적표 확인", inner);
    return;
  }
  inner += `<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;">
    <tr>${GRADE_COLS.map(c=>`<th style="text-align:left;padding:4px;border-bottom:1px solid var(--border);">${c.label}</th>`).join("")}<th></th></tr>
    ${state.record.gradesTable.map((row,ri)=>`<tr>
      ${GRADE_COLS.map(c=>`<td style="padding:2px;"><input type="text" style="width:100%;padding:5px;font-size:13px;" value="${(row[c.key]||"").toString().replace(/"/g,'&quot;')}" oninput="state.record.gradesTable[${ri}]['${c.key}']=this.value"></td>`).join("")}
      <td><button class="danger" style="padding:4px 8px;" onclick="removeGradeRow(${ri})">×</button></td>
    </tr>`).join("")}
  </table></div>
  <div class="row"><button class="ghost" onclick="addGradeRow()">+ 행 추가</button><button class="ghost" onclick="extractGradesTable()">다시 추출</button></div>`;
  if(state.record.gradesTable.length===0){
    inner += `<p class="muted">추출된 성적 정보가 없어. 행을 직접 추가하거나, 없으면 그냥 다음으로 넘어가도 돼(성적 기반 분석이 제한적으로 처리됨).</p>`;
  }
  inner += navButtons();
  app.innerHTML = card("성적표 확인/수정", inner);
}

function addGradeRow(){ state.record.gradesTable.push(emptyGradeRow()); render(); }
function removeGradeRow(i){ state.record.gradesTable.splice(i,1); render(); }

const ANALYSIS_PRINCIPLES = `너는 대입 학생부종합전형 면접 준비를 돕는 분석가다. 반드시 지켜야 할 원칙:
1) 오직 사용자가 제공한 생기부 텍스트/이미지와 학교 모집요강 텍스트/이미지 안에 있는 내용만 근거로 삼는다. 외부 지식으로 대학·학과 정보를 추측하거나 지어내지 않는다.
2) 생기부에 없는 활동이나 성취를 만들어내지 않는다. 근거가 불충분하면 "생기부 내 근거 부족"이라고 명시한다.
3) 최종 답변을 만들기 전에 스스로 각 주장이 어느 생기부 구절에 근거하는지 내부적으로 검증하고, 근거 없는 문문을 삭제한다(할루시네이션 자체 검증).
4) 반드시 순수 JSON 객체 하나만 출력한다. 코드블록 기호나 설명 문장, 마크다운 코드펜스를 붙이지 않는다.`;

function buildAnalysisUserContent(instructionText, includeImages=true){
  const schoolsText = state.schools.map((s,i)=>
    `[학교 ${i+1}] 이름:${s.name||"(미입력)"} / 학과:${s.dept||"(미입력)"} / 전형:${s.admissionType||"(미입력)"}\n인재상(직접입력):${s.idealTraits||"(없음)"}\n모집요강 텍스트:\n${(s.guideText||"(없음)").slice(0,15000)}`
  ).join("\n\n---\n\n");

  const gradesText = state.record.gradesTable.length
    ? state.record.gradesTable.map(r=>`${r.grade} ${r.semester} ${r.subject}: 등급 ${r.gradeLevel||"-"}, 원점수/평균 ${r.rawScore||"-"}, 표준편차 ${r.stdDev||"-"}, 성취도 ${r.achievement||"-"}`).join("\n")
    : (state.record.grades||"(입력 없음)");
  const recordText = `[1학년]\n${state.record.g1||"(내용 없음)"}\n\n[2학년]\n${state.record.g2||"(내용 없음)"}\n\n[3학년(PDF)]\n${state.record.g3||"(내용 없음)"}\n\n[성적표(사용자 확인/수정본)]\n${gradesText}\n\n[학생이 생각하는 본인 강점]\n${state.record.selfStrength||"(입력 없음)"}`;

  const hasAuto = state.record.autoImages.length>0;
  const hasSchoolImgs = state.schools.some(s=>s.guideImages&&s.guideImages.length);
  const content = [
    {type:"text", text: (instructionText||"")+"\n\n=== 학교별 자료 ===\n"+schoolsText+"\n\n=== 생기부 자료 ===\n"+recordText +
      (state.record.g3Images.length? "\n\n3학년 보완 자료 사진이 이어서 첨부됩니다. 사진 속 텍스트도 3학년 생기부 내용으로 취급해서 분석해줘.":"") +
      (hasAuto? "\n\n생기부 PDF가 글자 인식이 안 되는 스캔본이라 페이지 이미지로 변환해 이어서 첨부합니다. 이 이미지들을 생기부 원문으로 취급해서 읽어줘.":"") +
      (hasSchoolImgs? "\n\n일부 학교의 모집요강/인재상 자료도 이미지로 첨부됩니다. 어느 학교 자료인지는 이미지 순서와 위 학교 목록 순서를 대조해서 판단해줘.":"") +
      (!includeImages? "":"") }
  ];
  if(includeImages){
    state.record.g3Images.forEach(img=>{
      content.push({type:"image", source:{type:"base64", media_type: img.media.startsWith("image/")?img.media:"image/jpeg", data: img.data}});
    });
    state.record.autoImages.forEach(img=>{
      content.push({type:"image", source:{type:"base64", media_type: img.media, data: img.data}});
    });
    state.schools.forEach(s=>{
      (s.guideImages||[]).forEach(img=>{
        content.push({type:"image", source:{type:"base64", media_type: img.media, data: img.data}});
      });
      (s.idealTraitImages||[]).forEach(img=>{
        content.push({type:"image", source:{type:"base64", media_type: img.media, data: img.data}});
      });
    });
  }
  return content;
}

function renderStep3(){
  const app = document.getElementById("app");
  if(state.analysis===null && !state.busy){
    runAnalysis();
  }
  let html = "";

  if(state.busy){
    const p = state.analysisProgress;
    const pct = Math.round((p.step/p.total)*100);
    html += card(`분석 중 (${pct}%)`, `
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="loading" style="margin-top:10px;"><div class="spin"></div> ${p.label} (${p.step}/${p.total})</div>
      <div class="row"><button class="ghost" onclick="goStep(state.step-1)">이전 단계로 (진행 중인 요청은 백그라운드에서 계속됨)</button></div>`);
  }
  if(state.error){
    html += card("분석 실패", `<div class="err">${state.error}</div>
      <div class="row"><button class="ghost" onclick="goStep(state.step-1)">이전</button><button onclick="retryAnalysis()">처음부터 다시 분석</button></div>`);
    app.innerHTML = html; return;
  }

  const a = state.analysis;
  if(a && a.schools) html += card("학교별 우선순위 활동 Top 5", a.schools.map(s=>`
    <div class="activity"><b>${s.name}</b>
      <div class="muted">${s.ideaFitNote||""}</div>
      <ol>${(s.priorityActivities||[]).map(x=>`<li>${x}</li>`).join("")}</ol>
    </div>`).join(""));

  if(a && a.activityGrades) html += card("전체 활동 등급 정리", a.activityGrades.map(x=>{
    const cls = {"S":"g-S","A+":"g-Ap","A":"g-A","B+":"g-Bp","B":"g-B","C":"g-C"}[x.grade]||"g-C";
    return `<div class="activity"><span class="grade-badge ${cls}">${x.grade}</span><b>${x.activity}</b><div class="muted">${x.reason}</div></div>`;
  }).join(""));

  if(a && a.strengthsWeaknesses) html += card("성적 기반 강점 / 약점", `
    <b>강점</b><ul>${(a.strengthsWeaknesses.strengths||[]).map(x=>`<li>${x}</li>`).join("")}</ul>
    <b>약점</b><ul>${(a.strengthsWeaknesses.weaknesses||[]).map(x=>`<li>${x}</li>`).join("")}</ul>`);

  if(a && a.weaknessImprovementEfforts) html += card("약점 보완 노력 → 면접 활용 포인트", a.weaknessImprovementEfforts.map(x=>`
    <div class="activity"><b>${x.weakness}</b><div class="muted">근거: ${x.evidence}</div><div>${x.interviewTip}</div></div>`).join("") || "<p class='muted'>생기부 내에서 뚜렷한 보완 노력 근거를 찾지 못했어.</p>");

  if(a && a.selfPerceptionCompare){
    const c = a.selfPerceptionCompare;
    html += card("자기 인식 vs 실제 생기부 강점 비교", `
      <p><b>학생이 밝힌 강점:</b> ${c.studentBelieves||""}</p>
      <p><b>실제 확인되는 강점:</b> ${c.actualFound||""}</p>
      <p><b>차이:</b> ${c.gap||""}</p>
      ${c.suggestion? `<p><b>준비 대안:</b> ${c.suggestion}</p>`:""}`);
  }

  // ☁️ 클라우드 저장 버튼 추가
  if(a && !state.busy) {
    html += card("☁️ 데이터 클라우드 저장", `
      <p class="muted">분석한 내용과 진행 상태를 클라우드에 저장하면 고유 식별 코드가 발급됩니다. 이 코드로 다른 기기에서도 결과를 열람할 수 있습니다.</p>
      <button onclick="saveToCloud()" style="width:100%;">☁️ 클라우드에 결과 저장하기</button>
    `);
  }
  // 🧠 생기부 마인드맵 카드
  if (a && !state.busy) {
    html += card("🧠 생기부 역량 마인드맵", `
      <p class="muted">
        같은 탐구 주제로 이어지는 활동은 학년이 달라도 같은 색으로 묶고,
        같은 학년 안에서 연계한 활동은 선으로 연결합니다.
      </p>

      <div style="width:100%; height:380px; border:1px solid var(--border); border-radius:10px; background:#fff; overflow:auto; margin-bottom:10px;">
        <div id="mindmap-container" style="width:100%; min-height:100%; background:#fff;"></div>
      </div>

      <div class="row">
        <button class="ghost" onclick="generateMindmap()">현재 마인드맵 표시</button>
        <button onclick="reanalyzeMindmap()">🧠 마인드맵만 다시 분석</button>
      </div>
    `);
  }

  if(!state.busy && !state.error){
    html += a && a.selfPerceptionCompare
      ? navButtons({nextLabel:"모의 면접 시작하기"})
      : `<div class="row"><button class="ghost" onclick="goStep(state.step-1)">이전</button><button onclick="retryAnalysis()">분석 시작</button></div>`;
  }
  app.innerHTML = html;
}
function buildMindmapPrompt() {
  return `생기부 원문을 학년별·과목별로 비교해, 학년 간 탐구 주제의 연속성과 같은 학년 안에서 과목 간 지식이 이동한 사례를 찾아라.

[같은 학년 과목 연계 분석]
1. 각 학년에서 서로 다른 과목의 활동을 서로 비교하라. 특히 한 과목에서 배운 이론·개념·자료·분석 방법을 다른 과목 활동의 탐구·실험·보고서·프로그램 제작 등에 사용했는지 찾아라.
2. 생기부에 "연계했다"는 표현이 없어도, 앞 활동의 구체적인 이론이나 개념이 뒤 활동의 결과물 또는 탐구 방법에 사용된 것이 확인되면 연결하라.
3. 예: 3학년 생활과 윤리에서 사회 현상을 설명하는 이론을 학습하고, 사회문제탐구에서 그 이론을 적용한 프로그램을 제작했다면 두 활동을 연결한다. 생활과 윤리 활동을 from, 이론을 적용한 사회문제탐구 활동을 to로 지정한다.
4. 두 활동이 단지 넓은 주제만 비슷하거나 실제 지식의 이동이 확인되지 않으면 연결하지 마라.
5. 연결마다 두 활동의 과목명과 생기부 근거를 모두 evidence에 적어라. relation에는 "어떤 이론/개념을 어느 활동에 어떻게 적용했는지"를 짧고 구체적으로 써라. evidenceType은 생기부에 직접 명시된 연결이면 "명시", 활동 내용을 근거로 판단했다면 "내용상 연계"라고 써라.
6. from과 to는 반드시 nodes에 실제로 포함된 id를 사용하고, 두 노드의 grade는 같아야 한다. 한 연결의 방향은 지식·이론을 제공한 활동에서 적용한 활동으로 향하게 한다.
7. 관련성이 분명한 연결만 기록하고, 연결이 없으면 intraGradeConnections를 빈 배열로 반환하라.

[학년 간 주제 연계]
1. 1~3학년에서 같은 탐구가 이어지거나 내용상 같은 주제로 확장된 활동은 동일한 themeId를 사용하라.
2. 공통 단어만 있거나 근거가 약하면 같은 themeId로 묶지 마라. 각 활동의 themeEvidence에 판단 근거를 적어라.
3. 색상값은 출력하지 마라. 화면에서 동일한 themeId에 같은 색을 지정한다.

생기부에 없는 활동이나 연결은 만들지 마라. 활동 id는 모두 서로 달라야 한다.

출력 JSON(다른 텍스트 없이 이것만):
{"mindmap":{
  "themes":[{"id":"t1","name":"탐구 주제명"}],
  "nodes":[
    {"id":"n1","grade":3,"subject":"생활과 윤리","title":"이론을 학습한 활동","themeId":"t1","themeEvidence":"생기부 근거"},
    {"id":"n2","grade":3,"subject":"사회문제탐구","title":"이론을 적용한 프로그램 제작 활동","themeId":"t1","themeEvidence":"생기부 근거"}
  ],
  "intraGradeConnections":[
    {"from":"n1","to":"n2","relation":"생활과 윤리에서 배운 이론을 사회문제탐구 프로그램 제작에 적용","evidence":"두 과목 활동의 생기부 근거를 모두 기재","evidenceType":"명시 또는 내용상 연계"}
  ]
}}`;
}
// 1. 마인드맵 카드 레이아웃 그려주는 헬퍼 함수
function renderMindMap(mindmapData) {
  const nodes = Array.isArray(mindmapData?.nodes)
    ? mindmapData.nodes.filter(n => [1, 2, 3].includes(Number(n.grade)))
    : [];

  if (!nodes.length) {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" style="width:100%;height:100%;"><text x="50%" y="50%" text-anchor="middle" fill="#64748b" font-size="16">분석된 마인드맵 활동이 없습니다.</text></svg>';
  }

  const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[ch]));

  const palette = [
    "#2878B5", "#168A72", "#D66B37", "#A64D79",
    "#7256A8", "#8A7628", "#3B8D9B", "#B24C3D"
  ];

  const themes = Array.isArray(mindmapData.themes) ? mindmapData.themes : [];
  const themeById = {};

  themes.forEach((theme, index) => {
    themeById[theme.id] = {
      id: theme.id,
      name: theme.name || "탐구 주제",
      color: palette[index % palette.length]
    };
  });

  const groups = themes.map(theme => ({
    ...themeById[theme.id],
    nodes: nodes
      .filter(node => node.themeId === theme.id)
      .sort((a, b) => Number(a.grade) - Number(b.grade))
  })).filter(group => group.nodes.length);

  const unassigned = nodes.filter(node => !themeById[node.themeId]);

  if (unassigned.length) {
    groups.push({
      id: "unassigned",
      name: "주제 미분류",
      color: "#64748b",
      nodes: unassigned
    });
  }

  const cardW = 300;
  const cardH = 164;
  const branchGap = 204;
  const maxBranchNodes = Math.max(...groups.map(group => group.nodes.length), 1);
  const sin = Math.sin(Math.PI / Math.max(groups.length, 2));
  const firstNodeRadius = Math.max(340, (cardW + 76) / (2 * sin));
  const outerRadius = firstNodeRadius + (maxBranchNodes - 1) * branchGap + 90;
  const margin = cardW / 2 + 90;
  const legendRows = Math.ceil(groups.length / 3);
  const cx = outerRadius + margin;
  const cy = outerRadius + margin + legendRows * 28 + 36;
  const width = cx * 2;
  const height = cy + outerRadius + margin;
  const positions = {};
  const branches = [];
  const hubs = [];
  const cards = [];

  groups.forEach((group, index) => {
    const angle = -Math.PI / 2 + index * 2 * Math.PI / groups.length;
    const hubX = cx + 150 * Math.cos(angle);
    const hubY = cy + 150 * Math.sin(angle);

    branches.push(
      `<path d="M ${cx} ${cy} L ${hubX} ${hubY}" stroke="${group.color}" stroke-width="5" fill="none"/>`
    );

    hubs.push(
      `<g>
        <circle cx="${hubX}" cy="${hubY}" r="54" fill="#fff" stroke="${group.color}" stroke-width="4"/>
        <text x="${hubX}" y="${hubY + 4}" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="700">${esc(group.name).slice(0, 16)}</text>
      </g>`
    );

    group.nodes.forEach((node, nodeIndex) => {
      const radius = firstNodeRadius + nodeIndex * branchGap;
      const centerX = cx + radius * Math.cos(angle);
      const centerY = cy + radius * Math.sin(angle);
      const x = centerX - cardW / 2;
      const y = centerY - cardH / 2;

      positions[node.id] = { centerX, centerY, grade: Number(node.grade) };

      branches.push(
        `<path d="M ${hubX} ${hubY} L ${centerX} ${centerY}" stroke="${group.color}" stroke-width="3" fill="none"/>`
      );

      const titleChars = [...String(node.title || "활동 내용 미기재")];
      const titleLines = [];

      while (titleChars.length && titleLines.length < 6) {
        titleLines.push(titleChars.splice(0, 21).join(""));
      }

      if (titleChars.length && titleLines.length) {
        titleLines[titleLines.length - 1] += "…";
      }

      const titleSvg = titleLines.map((line, i) =>
        `<tspan x="${x + 14}" dy="${i ? 17 : 0}">${esc(line)}</tspan>`
      ).join("");

      cards.push(
        `<g>
          <title>${esc(node.themeEvidence || group.name)}</title>
          <rect x="${x}" y="${y}" width="${cardW}" height="${cardH}" rx="13" fill="#fff" stroke="${group.color}" stroke-width="2.5"/>
          <rect x="${x + 10}" y="${y + 10}" width="66" height="20" rx="10" fill="${group.color}"/>
          <text x="${x + 43}" y="${y + 24}" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">${node.grade}학년</text>
          <text x="${x + 84}" y="${y + 24}" fill="#475569" font-size="10">${esc(node.subject || "과목 미상")}</text>
          <text x="${x + 14}" y="${y + 52}" fill="#1e293b" font-size="12" font-weight="600">${titleSvg}</text>
        </g>`
      );
    });
  });

  const connections = (Array.isArray(mindmapData.intraGradeConnections)
    ? mindmapData.intraGradeConnections
    : [])
    .filter(c =>
      positions[c.from] &&
      positions[c.to] &&
      c.from !== c.to &&
      positions[c.from].grade === positions[c.to].grade
    )
    .map(c => {
      const from = positions[c.from];
      const to = positions[c.to];
      const mx = (from.centerX + to.centerX) / 2;
      const my = (from.centerY + to.centerY) / 2;
      const relation = esc(c.relation || "교과 연계");

      return `<g>
        <title>${esc(c.evidence || c.relation || "같은 학년 내 연계")}</title>
        <path d="M ${from.centerX} ${from.centerY} Q ${mx + 28} ${my - 28}, ${to.centerX} ${to.centerY}" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="7 5"/>
        <rect x="${mx - 48}" y="${my - 11}" width="96" height="22" rx="11" fill="#fff" stroke="#94a3b8"/>
        <text x="${mx}" y="${my + 4}" text-anchor="middle" fill="#334155" font-size="9">${relation.slice(0, 13)}</text>
      </g>`;
    }).join("");

 const legend = groups.map((group, index) => {
  const x = 28 + (index % 3) * 390;
  const y = 32 + Math.floor(index / 3) * 28;
  const fullName = String(group.name || "탐구 주제");
  const label = [...fullName].slice(0, 24).join("");
  const displayName = fullName.length > 24 ? label + "…" : label;

  return `<g>
    <title>${esc(fullName)}</title>
    <circle cx="${x}" cy="${y}" r="6" fill="${group.color}"/>
    <text x="${x + 12}" y="${y + 4}" fill="#334155" font-size="12">${esc(displayName)}</text>
  </g>`;
}).join("");
  const root = `<g>
    <circle cx="${cx}" cy="${cy}" r="68" fill="#1f2937"/>
    <text x="${cx}" y="${cy - 3}" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">생기부</text>
    <text x="${cx}" y="${cy + 20}" text-anchor="middle" fill="#e2e8f0" font-size="12">탐구 흐름</text>
  </g>`;

  return `<svg xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 ${width} ${height}"
    role="img"
    aria-label="주제별 생기부 마인드맵"
    style="display:block;width:100%;height:auto;min-width:980px;background:#fff">
    <rect width="100%" height="100%" fill="#fff"/>
    ${legend}
    ${branches.join("")}
    ${connections}
    ${hubs.join("")}
    ${root}
    ${cards.join("")}
  </svg>`;
}

// 2. 기존 generateMindmap 교체 함수
function generateMindmap() {
  let container =
    document.getElementById("mindmap-container") ||
    document.getElementById("mindmapSvg");

  if (!container) return;

  // renderMindMap은 HTML을 반환하므로 SVG 대신 일반 HTML 컨테이너를 사용
  if (container.tagName.toLowerCase() === "svg") {
    const replacement = document.createElement("div");
    replacement.id = "mindmap-container";
    replacement.style.cssText =
      "width:100%; height:100%; overflow:auto; background:#fff; border-radius:10px; padding:12px;";
    container.replaceWith(replacement);
    container = replacement;
  }

  const analysisData =
    (typeof state !== "undefined" && state.analysis)
      ? state.analysis
      : window.lastAnalysisResult;

  const mindmapData = analysisData && analysisData.mindmap;

  if (
    mindmapData &&
    Array.isArray(mindmapData.nodes) &&
    mindmapData.nodes.length > 0
  ) {
    container.innerHTML = renderMindMap(mindmapData);
  } else {
    container.innerHTML =
      '<div style="padding:20px; text-align:center; color:#6b7280;">분석된 마인드맵 데이터가 없습니다. 생기부 분석 후 다시 시도해 주세요.</div>';
  }
}
async function reanalyzeMindmap() {
  if (state.busy) return;

  state.busy = true;
  state.analysisProgress = {
    step: 0,
    total: 1,
    label: "마인드맵만 다시 분석 중"
  };
  render();

  try {
    const content = buildAnalysisUserContent(buildMindmapPrompt(), true);
    const raw = await callClaude({
      system: ANALYSIS_PRINCIPLES,
      content,
      maxTokens: 4096
    });

    const parsed = extractJSON(raw);
    const result =
      parsed.mindmap &&
      Array.isArray(parsed.mindmap.nodes) &&
      parsed.mindmap.nodes.length > 0
        ? parsed.mindmap
        : parsed;

    if (!Array.isArray(result.nodes) || result.nodes.length === 0) {
      throw new Error("마인드맵 활동 데이터가 없습니다. 생기부 입력을 확인해 주세요.");
    }

    state.analysis = state.analysis || {};
    state.analysis.mindmap = {
      themes: Array.isArray(result.themes) ? result.themes : [],
      nodes: result.nodes,
      intraGradeConnections: Array.isArray(result.intraGradeConnections)
        ? result.intraGradeConnections
        : []
    };
  } catch (e) {
    alert("마인드맵 재분석 실패: " + e.message);
  } finally {
    state.busy = false;
    state.analysisProgress.step = 1;
    render();
    generateMindmap();
  }
}
function retryAnalysis(){
  state.error = "";
  state.analysis = null;
  render();
}

async function runStage(label, instructionText, maxTokens, includeImages=true){
  state.analysisProgress.label = label;
  render();
  const content = buildAnalysisUserContent(instructionText, includeImages);
  const raw = await callClaude({system: ANALYSIS_PRINCIPLES, content, maxTokens});
  const parsed = extractJSON(raw);
  state.analysisProgress.step++;
  return parsed;
}

function buildInterviewSystemPrompt(){
  return `너는 대입 면접관이다. 반드시 아래 지시를 따르고 순수 JSON 객체만 출력하라.

[AI 면접관 종합 운영 및 난이도 제어 지침]

■ 1. 기본 면접 진행 규칙 (5단계 순차적 난이도 상승)
전체 면접은 초기 지원자의 긴장을 풀고, 뒤로 갈수록 심화 학술 역량을 검증하도록 아래 5단계 순서로 진행한다.
- 1단계 (★☆☆☆☆): 긴장 완화, 아이스브레이킹, 기본 지원 동기 및 인성 질문
- 2단계 (★★☆☆☆): 제출 서류(생기부/자소서) 기반 주요 활동 진위 및 기본 관심도 확인
- 3단계 (★★★★☆): 제출 활동 내 핵심 학술 개념, 원리, 공식, 메커니즘 검증 (난이도 급상승)
- 4단계 (★★★★★): 3번 답변에 대한 심화 꼬리질문, 비교 분석, 한계점 및 예외 대처 검증
- 5단계 (★☆☆☆☆): 마지막 30초 발언 및 입학 후 학업/진로 포부

■ 2. 동적 추가 질문 생성 규칙 (버튼 클릭 / 명령어 입력 시)
사용자가 추가 질문을 요청하거나 난이도를 지정할 경우, AI는 반드시 아래 규격에 맞추어 정확히 5개의 질문을 번호(1~5)를 붙여 생성한다.

[난이도별 질문 기준]
- [하 / 1~2단계]: 기본 개념 확인, 단순 사실 관계, 경험/인성/협업 중심 질문
- [중 / 3단계]: 활동 과정 및 이유, 적용 사례, 서류 진위 및 과목 관심도 질문
- [상 / 4~5단계]: 학술적 원리/수식/메커니즘, 심화 비교, 꼬리질문, 한계점 및 예외 대처 질문

[생성 조건]
- 요청에 맞춰 한 번에 무조건 5개의 질문을 제시한다.
- 특정 난이도가 지정되면 5개 질문 전체를 해당 난이도로 맞추고, 지정이 없으면 [중~상] 수준으로 구성한다.
- 모든 질문은 지원자의 생기부 정보 및 직전 대화 맥락과 긴밀히 연계되어야 한다.

[키워드 추출 지침]
제공된 생기부 원문에서 형광펜을 칠할 '정확한 키워드 단어/구절'을 원문에서 그대로 찾아 추출하라.
1. yellowKeywords: 전공 관련 핵심 개념어/전문 용어 (예: ["바루브르크효과"])
2. greenKeywords: 수치, 통계, 측정 데이터 (예: ["34.8%"])
3. redKeywords: 학생의 주요 주장, 결론 (예: ["가변적 조정이 최적의 대안"])
4. blueKeywords: 탐구 제목, 활동명, 학생이 실제로 수행한 활동을 설명하는 원문의 짧은 구절.
   반드시 생기부에 있는 문구를 그대로 추출하고, 관련 없는 문장 전체를 길게 선택하지 마라.
[출력 JSON 스키마 (다른 설명 절대 금지)]
{
  "yellowKeywords": ["원문에 있는 정확한 단어"],
  "greenKeywords": ["원문에 있는 정확한 단어"],
  "redKeywords": ["원문에 있는 정확한 단어"],
  "blueKeywords": ["생기부 원문에 있는 탐구 제목 또는 활동 구절"],
  "questions": [
    {"stage": "1단계", "difficulty": "★☆☆☆☆", "question": "질문 내용", "basedOn": "타겟 키워드", "sampleAnswer": "모범 답변"},
    {"stage": "2단계", "difficulty": "★★☆☆☆", "question": "질문 내용", "basedOn": "타겟 키워드", "sampleAnswer": "모범 답변"},
    {"stage": "3단계", "difficulty": "★★★☆☆", "question": "질문 내용", "basedOn": "타겟 키워드", "sampleAnswer": "모범 답변"},
    {"stage": "4단계", "difficulty": "★★★★☆", "question": "질문 내용", "basedOn": "타겟 키워드", "sampleAnswer": "모범 답변"},
    {"stage": "5단계", "difficulty": "★☆☆☆☆", "question": "질문 내용", "basedOn": "타겟 키워드", "sampleAnswer": "모범 답변"}
  ],
  "mindmap": {
    "themes": [
      { "id": "t1", "name": "주제명 (예: 로지스틱 모델 탐구)", "color": "#3b82f6" }
    ],
    "nodes": [
      { "id": "n1", "grade": 1, "subject": "과목명", "title": "핵심 활동 내용", "themeId": "t1" },
      { "id": "n2", "grade": 2, "subject": "과목명", "title": "핵심 활동 내용", "themeId": "t1" }
    ],
    "intraGradeConnections": [
      { "from": "n3", "to": "n4", "relation": "3학년 국어 지문 주제를 3학년 미적분 수식으로 연계" }
    ]
  }
}`;
}

async function generateQuestions(){
  state.busy = true; state.error=""; render();
  try{
    const rawRecordText = `[1학년]\n${state.record.g1 || ""}\n\n[2학년]\n${state.record.g2 || ""}\n\n[3학년]\n${state.record.g3 || ""}`;
    
    if (!state.record.g1 && !state.record.g2 && !state.record.g3) {
      throw new Error("생기부 텍스트가 없습니다. '3. 생기부' 단계에서 텍스트를 채워주세요.");
    }

    const prompt = `[생기부 원문]\n${rawRecordText}\n\n위 생기부를 바탕으로 지침의 기본 면접 진행 규칙 1~5단계에 따라 질문 5개와 형광펜 키워드를 추출해줘.`;

    const raw = await callClaude({
      system: buildInterviewSystemPrompt(),
      content: [{ type: "text", text: prompt }],
      maxTokens: 3000
    });
    
    const parsed = extractJSON(raw);

    const applyHighlight = (originalText) => {
      if (!originalText) return "";
      let result = originalText;

      (parsed.yellowKeywords || []).forEach(kw => {
        if (kw && kw.trim()) result = result.split(kw).join(`<mark class="hl-yellow">${kw}</mark>`);
      });
      (parsed.greenKeywords || []).forEach(kw => {
        if (kw && kw.trim()) result = result.split(kw).join(`<mark class="hl-green">${kw}</mark>`);
      });
      (parsed.redKeywords || []).forEach(kw => {
        if (kw && kw.trim()) result = result.split(kw).join(`<mark class="hl-red">${kw}</mark>`);
      });
      (parsed.blueKeywords || []).forEach(kw => {
        if (kw && kw.trim()) {
          result = result.split(kw).join(`<mark class="hl-blue">${kw}</mark>`);
        }
      });

      return result;
    };

    state.interview.highlightedG1 = applyHighlight(state.record.g1);
    state.interview.highlightedG2 = applyHighlight(state.record.g2);
    state.interview.highlightedG3 = applyHighlight(state.record.g3);
    state.interview.highlightedText = `[1학년]\n${state.interview.highlightedG1}\n\n[2학년]\n${state.interview.highlightedG2}\n\n[3학년]\n${state.interview.highlightedG3}`;
    state.interview.questions = parsed.questions || [];
    state.interview.idx = 0;
  }catch(e){ state.error = e.message; }
  state.busy = false; render();
}

async function generateMoreQuestions(level){
  state.busy = true; render();
  try {
    const rawRecordText = `[1학년]\n${state.record.g1 || ""}\n\n[2학년]\n${state.record.g2 || ""}\n\n[3학년]\n${state.record.g3 || ""}`;
    const prompt = `[생기부 원문]\n${rawRecordText}\n\n[요청] 지침의 '■ 2. 동적 추가 질문 생성 규칙'에 따라 난이도 [${level}] 수준에 맞추어 정확히 5개의 추가 면접 질문을 생성해줘.`;

    const raw = await callClaude({
      system: buildInterviewSystemPrompt(),
      content: [{ type: "text", text: prompt }],
      maxTokens: 2500
    });

    const parsed = extractJSON(raw);
    if(parsed.questions && parsed.questions.length > 0){
      state.interview.questions = [...state.interview.questions, ...parsed.questions];
    }
  } catch(e) { state.error = e.message; }
  state.busy = false; render();
}

      entry.followups[entry.followups.length-1].a = answerText;
    }
    const entry = state.interview.log[isFollowup?followupParentIdx:qIdx];
    const content = [{type:"text", text:
      `원 질문: ${entry.q}\n학생 답변 기록(순서대로): ${JSON.stringify([{a:entry.a}, ...entry.followups])}\n
      생기부 분석 요약: ${JSON.stringify(state.analysis)}\n
      이 답변과 직접 관련 있고 주제에서 벗어나지 않는 심화 꼬리질문이 필요한지 판단해줘. 필요 없으면 needFollowup:false.
      JSON: {"needFollowup":true/false, "followupQuestion":"..."}`
    }];
    const raw = await callClaude({system: buildInterviewSystemPrompt(), content, maxTokens:800});
    const parsed = extractJSON(raw);
    if(parsed.needFollowup && parsed.followupQuestion){
      entry.followups.push({q: parsed.followupQuestion, a:""});
    }
  }catch(e){ state.error = e.message; }
  state.busy = false; render();
}

function renderStep4(){
  const app = document.getElementById("app");
  if(state.interview.questions.length===0 && !state.busy && !state.error){
    generateQuestions();
    return;
  }
  if(state.busy && state.interview.questions.length===0){
    app.innerHTML = card("질문 생성 중", `<div class="loading"><div class="spin"></div> 5단계 난이도 제어 지침에 따라 5개의 맞춤형 면접 질문을 생성 중이야.</div>
      <div class="row"><button class="ghost" onclick="goStep(state.step-1)">이전 단계로</button></div>`);
    return;
  }
  if(state.error && state.interview.questions.length===0){
    app.innerHTML = card("질문 생성 실패", `<div class="err">${state.error}</div>
      <div class="row"><button class="ghost" onclick="goStep(state.step-1)">이전</button><button onclick="state.error='';generateQuestions();">다시 시도</button></div>`);
    return;
  }
  
  const grade = state.interview?.grade || "A";
  const gradeReason = state.interview?.gradeReason || "세부 사유 분석 완료";

  const gradeColors = {
    "S": { bg: "#fef3c7", text: "#d97706", border: "#f59e0b" },
    "A+": { bg: "#dbeafe", text: "#2563eb", border: "#3b82f6" },
    "A": { bg: "#d1fae5", text: "#059669", border: "#10b981" }
  };
  const style = gradeColors[grade] || gradeColors["A"];

  let html = card("생기부 종합 평가 등급", `
    <div style="display: flex; align-items: center; gap: 20px; padding: 10px 0;">
      <div style="
        font-size: 36px; 
        font-weight: 900; 
        background: ${style.bg}; 
        color: ${style.text}; 
        border: 2px solid ${style.border}; 
        padding: 12px 24px; 
        border-radius: 16px;
        min-width: 90px;
        text-align: center;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      ">
        ${grade}
      </div>
      <div style="flex: 1; font-size: 15px; line-height: 1.6; color: #374151;">
        <strong style="color: #111827; font-size: 16px;">[평가 총평 및 산출 사유]</strong><br>
        ${gradeReason}
      </div>
    </div>
  `);

  html += card("AI 생기부 핵심 분석 (형광펜)", `
    <div class="muted" style="margin-bottom:8px;">노랑: 개념어 / 초록: 수치·자료 / 빨강: 주장·결론</div>
    <div class="highlight-board">${state.interview?.highlightedText || state.interview?.highlightText || state.interview?.highlights || "형광펜 분석 데이터가 없습니다."}</div>
  `);

  html += card("5단계 난이도 맞춤형 모의 면접", `<p class="muted">지침에 따라 난이도가 순차적으로 상승하는 5개의 면접 질문이야.</p>${state.error?`<div class="err">${state.error}</div>`:""}`);
  
  state.interview.questions.forEach((q,i)=>{
    const log = state.interview.log[i];
    const stageBadge = q.stage && q.difficulty ? `<span style="font-size:12px; font-weight:bold; background:#3b82f6; color:white; padding:3px 8px; border-radius:6px; margin-right:8px;">${q.stage} (${q.difficulty})</span>` : '';
    html += `<div class="card">
      <div class="chat-msg chat-q" style="position: relative;">
        <div style="margin-bottom: 6px;">${stageBadge}</div>
        <b>Q${i+1}.</b> ${q.question}
        <div class="muted" style="margin-top:6px;">타겟 키워드: ${q.basedOn||""}</div>
        <button onclick="speakQuestion('${q.question.replace(/'/g, "\\'")}')" style="margin-top: 8px; padding: 4px 10px; font-size: 13px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer;">🔊 질문 듣기</button>
      </div>
      <details><summary>예시 답변 보기</summary><div class="muted">${q.sampleAnswer||""}</div></details>
      ${log? `<div class="chat-msg chat-a">${log.a}</div>` : 
        `<div style="margin: 6px 0;">
           <button id="stt-btn-${i}" onclick="startSTT(${i})" type="button" style="padding: 6px 12px; font-size: 13px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer;">🎙️ 음성으로 답변하기</button>
         </div>
         <textarea id="ans${i}" placeholder="답변을 입력하거나 음성으로 말해주세요"></textarea>
         <div class="row"><button ${state.busy?"disabled":""} onclick="submitAnswer(${i}, document.getElementById('ans${i}').value, false)">답변 제출</button></div>`}
      ${log && log.followups.map((f,fi)=>`
        <div class="chat-msg chat-f"><b>추가질문.</b> ${f.q}</div>${f.a? `<div class="chat-msg chat-a">${f.a}</div>` :
          `<textarea id="fans${i}_${fi}" placeholder="추가질문 답변"></textarea>
           <div class="row"><button ${state.busy?"disabled":""} onclick="submitAnswer(${i}, document.getElementById('fans${i}_${fi}').value, true, ${i})">답변 제출</button></div>`}
      `).join("") || ""}
    </div>`;
  });

  html += `
    <div class="card" style="text-align: center; background: #f8fafc; padding: 20px; border: 1px dashed #cbd5e1;">
      <h4 style="margin: 0 0 10px 0; font-size: 16px; color: #1e293b;">➕ 난이도 지정 추가 질문 5개 생성하기</h4>
      <p class="muted" style="margin-bottom: 12px;">원하는 난이도를 클릭하면 해당 난이도 기준의 질문 5개가 하단에 추가 생성됩니다.</p>
      <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
        <button ${state.busy?"disabled":""} onclick="generateMoreQuestions('하')" style="background: #10b981; color: white; padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;">🟢 [하 / 1~2단계] 5개 생성</button>
        <button ${state.busy?"disabled":""} onclick="generateMoreQuestions('중')" style="background: #f59e0b; color: white; padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;">🟡 [중 / 3단계] 5개 생성</button>
        <button ${state.busy?"disabled":""} onclick="generateMoreQuestions('상')" style="background: #ef4444; color: white; padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;">🔴 [상 / 4~5단계] 5개 생성</button>
      </div>
    </div>
  `;

  html += navButtons({nextLabel:"완료", next:false});
  app.innerHTML = html;
}

function onNext(){
  state.error="";
  if(state.step===0){
    const key = document.getElementById("apiKeyInput").value.trim();
    if(!key){ document.getElementById("step0err").textContent = "API 키를 입력해줘."; return; }
    state.apiKey = key; saveKey();
  }
  if(state.step===1){
    if(state.schools.every(s=>!s.name)){ document.getElementById("step1err").textContent = "학교를 최소 1개 입력해줘."; return; }
  }
  if(state.step===2){
    if(!state.record.g1 && !state.record.g2 && !state.record.g3 && state.record.g3Images.length===0 && state.record.autoImages.length===0){
      document.getElementById("step2err").textContent = "생기부 내용을 최소한 하나는 입력해줘.";
      return;
    }
  }
  if(state.step===3){
    state.analysis = null; state.error="";
  }
  if(state.step===4){
    state.interview.questions = [];
  }
  state.step++;
  render();
}

render();

// 3색 형광펜 기능 이벤트 리스너
document.addEventListener('mouseup', function(e) {
  const hlPopup = document.getElementById('hlPopup');
  if(hlPopup.contains(e.target)) return;
  
  const sel = window.getSelection();
  if(sel.toString().trim().length > 0 && !e.target.closest('input, textarea')) {
    const range = sel.getRangeAt(0);
    const rect = range.getBoundingClientRect();
    
    hlPopup.style.display = 'flex';
    hlPopup.style.top = (rect.top + window.scrollY - 45) + 'px';
    hlPopup.style.left = (rect.left + window.scrollX + (rect.width / 2) - 50) + 'px';
  } else {
    hlPopup.style.display = 'none';
  }
});

function doHighlight(color) {
  document.designMode = "on";
  document.execCommand("hiliteColor", false, color); 
  document.execCommand("backColor", false, color);   
  document.designMode = "off";
  
  document.getElementById('hlPopup').style.display = 'none';
  window.getSelection().removeAllRanges();
}
</script>
<script>
// 무료 오픈 TTS 백엔드 API 연결
async function speakQuestion(text) {
  if (!text) return;
  try {
    const response = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });

    if (!response.ok) {
      throw new Error("음성 데이터를 불러오지 못했습니다.");
    }

    const blob = await response.blob();
    const audioUrl = URL.createObjectURL(blob);
    const audio = new Audio(audioUrl);
    audio.playbackRate = 1.15;
    audio.play();
  } catch (error) {
    console.error("TTS 오류:", error);
    alert("음성을 재생하는 데 실패했습니다.");
  }
}
</script>
